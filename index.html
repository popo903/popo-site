  <div class="top-actions">

    <button class="icon-btn" id="btn-settings" title="设置"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M128 80a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32m109.94-52.79a8 8 0 0 0-3.89-5.4l-29.83-17l-.12-33.62a8 8 0 0 0-2.83-6.08a111.9 111.9 0 0 0-36.72-20.67a8 8 0 0 0-6.46.59L128 41.85L97.88 25a8 8 0 0 0-6.47-.6a112.1 112.1 0 0 0-36.68 20.75a8 8 0 0 0-2.83 6.07l-.15 33.65l-29.83 17a8 8 0 0 0-3.89 5.4a106.5 106.5 0 0 0 0 41.56a8 8 0 0 0 3.89 5.4l29.83 17l.12 33.62a8 8 0 0 0 2.83 6.08a111.9 111.9 0 0 0 36.72 20.67a8 8 0 0 0 6.46-.59L128 214.15L158.12 231a7.9 7.9 0 0 0 3.9 1a8.1 8.1 0 0 0 2.57-.42a112.1 112.1 0 0 0 36.68-20.73a8 8 0 0 0 2.83-6.07l.15-33.65l29.83-17a8 8 0 0 0 3.89-5.4a106.5 106.5 0 0 0-.03-41.52m-15 34.91l-28.57 16.25a8 8 0 0 0-3 3c-.58 1-1.19 2.06-1.81 3.06a7.94 7.94 0 0 0-1.22 4.21l-.15 32.25a95.9 95.9 0 0 1-25.37 14.3L134 199.13a8 8 0 0 0-3.91-1h-3.83a8.1 8.1 0 0 0-4.1 1l-28.84 16.1A96 96 0 0 1 67.88 201l-.11-32.2a8 8 0 0 0-1.22-4.22c-.62-1-1.23-2-1.8-3.06a8.1 8.1 0 0 0-3-3.06l-28.6-16.29a90.5 90.5 0 0 1 0-28.26l28.52-16.28a8 8 0 0 0 3-3c.58-1 1.19-2.06 1.81-3.06a7.94 7.94 0 0 0 1.22-4.21l.15-32.25a95.9 95.9 0 0 1 25.37-14.3L122 56.87a8 8 0 0 0 4.1 1h3.64a8.1 8.1 0 0 0 4.1-1l28.84-16.1A96 96 0 0 1 188.12 55l.11 32.2a8 8 0 0 0 1.22 4.22c.62 1 1.23 2 1.8 3.06a8.1 8.1 0 0 0 3 3.06l28.6 16.29a90.5 90.5 0 0 1 .05 28.29Z"/></svg></button>

<!-- 主内容区域 -->
<main class="page-area">

  <!-- ============ 首页 ============ -->
  <section class="page" id="page-home">
    <div class="greeting">
      <span id="greeting-text">popo，今天也要元气满满哦！</span>
      <span class="date-sub" id="home-date"></span>
    </div>
    <div class="home-modules" id="home-modules">
      <!-- 模块会被 JS 按顺序渲染 -->
    </div>
  </section>

  <!-- ============ 今日计划 ============ -->
  <section class="page" id="page-plan" hidden>
    <div class="page-header">
      <h2 class="page-title">今日计划</h2>
      <div class="page-header-right">
        <button class="icon-btn" id="btn-calendar" title="日历"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4 .5a.5.5 0 0 0-1 0V1H2a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-1V.5a.5.5 0 0 0-1 0V1H4zM1 14V4h14v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1m7-6.507c1.664-1.711 5.825 1.283 0 5.132c-5.825-3.85-1.664-6.843 0-5.132"/></svg></button>
        <button class="icon-btn" id="btn-new-tomorrow" title="新建明日计划"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M240 96a8 8 0 0 1-8 8h-16v16a8 8 0 0 1-16 0v-16h-16a8 8 0 0 1 0-16h16V72a8 8 0 0 1 16 0v16h16a8 8 0 0 1 8 8m-96-40h8v8a8 8 0 0 0 16 0v-8h8a8 8 0 0 0 0-16h-8v-8a8 8 0 0 0-16 0v8h-8a8 8 0 0 0 0 16m72.77 97a8 8 0 0 1 1.43 8A96 96 0 1 1 95.07 37.8a8 8 0 0 1 10.6 9.06a88.07 88.07 0 0 0 103.47 103.47a8 8 0 0 1 7.63 2.67m-19.39 14.88c-1.79.09-3.59.14-5.38.14A104.11 104.11 0 0 1 88 64c0-1.79 0-3.59.14-5.38a80 80 0 1 0 109.24 109.24Z"/></svg></button>
      </div>
    </div>
    <div class="plan-date-display" id="plan-date-display"></div>

    <!-- 今日必做 -->
    <div class="card" id="top5-card">
      <div class="card-title-row">
        <span class="card-title">Must Do/今日必做</span>
        <div class="note-palette-wrap">
          <button class="note-palette-btn" id="btn-note-palette" title="更换便利贴颜色"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M200.77 53.89A103.27 103.27 0 0 0 128 24h-1.07A104 104 0 0 0 24 128c0 43 26.58 79.06 69.36 94.17A32 32 0 0 0 136 192a16 16 0 0 1 16-16h46.21a31.81 31.81 0 0 0 31.2-24.88a104.4 104.4 0 0 0 2.59-24a103.28 103.28 0 0 0-31.23-73.23m13 93.71a15.89 15.89 0 0 1-15.56 12.4H152a32 32 0 0 0-32 32a16 16 0 0 1-21.31 15.07C62.49 194.3 40 164 40 128a88 88 0 0 1 87.09-88h.9a88.35 88.35 0 0 1 88 87.25a89 89 0 0 1-2.18 20.35ZM140 76a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-44 24a12 12 0 1 1-12-12a12 12 0 0 1 12 12m0 56a12 12 0 1 1-12-12a12 12 0 0 1 12 12m88-56a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></svg></button>
          <div class="note-palette-pop" id="note-palette-pop" hidden>
            <span class="note-dot" data-bg="#F8C8C8" style="background:#F8C8C8" title="粉"></span>
            <span class="note-dot" data-bg="#EEEEAE" style="background:#EEEEAE" title="黄"></span>
            <span class="note-dot" data-bg="#CDDC84" style="background:#CDDC84" title="绿"></span>
            <span class="note-dot" data-bg="#E0EEE8" style="background:#E0EEE8" title="青"></span>
            <span class="note-dot" data-bg="#6B6882" style="background:#6B6882" title="紫"></span>
            <span class="note-dot" data-bg="#E4C6D0" style="background:#E4C6D0" title="玫"></span>
            <span class="note-dot note-dot-default" data-bg="" style="background:#bcc48f" title="默认嫩豆绿"></span>
          </div>
        </div>
      </div>
      <div class="top5-list" id="top5-list"></div>
    </div>

    <!-- 时间段计划 -->
    <div class="card" id="timeblocks-card">
      <div class="card-title-row">
        <span class="card-title">Schedule/日程安排</span>
        <button class="btn-small" id="btn-add-timeblock">+ 添加时间段</button>
      </div>
      <div class="timeblock-table-wrap">
        <table class="timeblock-table" id="timeblock-table">
          <thead>
            <tr>
              <th class="col-time">时间段</th>
              <th class="col-planned">计划完成</th>
              <th class="col-actual">实际完成</th>
              <th class="col-ops"></th>
            </tr>
          </thead>
          <tbody id="timeblock-tbody"></tbody>
        </table>
      </div>
      <div class="timeblock-empty" id="timeblock-empty" hidden>还没有时间段，点击右上角添加 →</div>
    </div>

    <!-- 每日反思 -->
    <div class="card" id="reflection-card">
      <div class="card-title">Reflection/反思</div>
      <div class="reflection-wrap">
        <textarea id="reflection-textarea" class="reflection-area" placeholder="不贵于无过，而贵于能改过。"></textarea>
        <div class="reflection-count" id="reflection-count">0 字</div>
      </div>
    </div>
  </section>

  <!-- ============ 备忘 ============ -->
  <section class="page" id="page-memo" hidden>
    <div class="page-header">
      <h2 class="page-title">Memo/备忘</h2>
    </div>
    <div class="memo-input-bar">
      <input type="text" id="memo-input" class="memo-input" placeholder="此刻突然想到什么？直接写下来...">
      <button class="btn-icon" id="memo-image" title="添加本地图片"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M13.168 9.565c-.217-.484-2.153-.674-3.336.858a3.012 3.012 0 0 0 2.547 4.835a2.945 2.945 0 0 0 2.814-2.792c.137-1.973-1.54-3.22-2.024-2.9zm-.145.482c-.293.2-1.386-.362-2.25 1.037c-1.555 2.525 2.805 4.207 3.272 1.26a2.29 2.29 0 0 0-1.022-2.296z"/><path d="M7.116.17C4.392.015 1.263-.35.454 2.532A17.2 17.2 0 0 0 .527 7.85a.386.386 0 0 0 .394.384c.518 0 .384-.353.65-4.21C1.814 1.25 3.325 1.295 7.14.942a.387.387 0 0 0-.023-.773zM.11 16.662c-.642 7.572 1.494 7.826 7.44 6.885a.39.39 0 1 0-.065-.778c-1.604 0-4.925.138-5.529-.79A19.6 19.6 0 0 1 .88 16.662a.386.386 0 0 0-.77 0M16.76 1.076c3.84.915 5.89-.259 6.027 4.07c.096 2.149-.072 3.134.519 3.11a.38.38 0 0 0 .363-.404c.039-1.706 1.15-4.925-.93-6.662c-1.74-1.376-4.281-.723-5.86-.868a.386.386 0 1 0-.12.754m6.211 14.48c-.517 6.596-.91 6.666-4.732 7.12c-.72.106-1.555.293-2.28.324a.39.39 0 0 0-.02.778q1.192.06 2.38 0c2.334-.047 4.573-.3 5.25-2.795c.204-.873.635-5.8-.203-5.814a.394.394 0 0 0-.394.387M6.777 7.689c-2.987.547-3.057 6.46-1.802 8.769c1.094 1.967 3.458 1.835 5.923 1.9c3.593.1 7.258.484 8.63-2.608a8.4 8.4 0 0 0 .573-3.482c-.058-1.188-.368-2.81-.91-3.41a2.74 2.74 0 0 0-1.575-.87a3.095 3.095 0 0 0-2.332-3.2c-1.934-.3-3.9-.333-5.843-.101a3.16 3.16 0 0 0-2.664 3.002m8.244-1.991a21.5 21.5 0 0 0-5.345.122c-2.202.518-1.228 2.95-2.272 3.084c-2.372.324-2.074 5.076-1.312 6.727a1.84 1.84 0 0 0 5.35 1.088c2.733.327 5.488.432 8.238.314a3.24 3.24 0 0 0 2.837-1.763a8.35 8.35 0 0 0 .216-5.57a1.91 1.91 0 0 0-1.478-.99c-.79-.132.117-2.44-2.224-3.004z"/></g></svg></button>
      <button class="btn-primary" id="memo-save">保存</button>
      <input type="file" id="memo-file" accept="image/*" multiple hidden>
    </div>
    <div class="memo-image-previews" id="memo-image-previews"></div>
    <div class="memo-folders" id="memo-folders"></div>
    <div class="memo-list" id="memo-list"></div>
  </section>

  <!-- ============ popo知识库 ============ -->
  <section class="page" id="page-knowledge" hidden>
    <div class="page-header">
      <h2 class="page-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M232.7 50.48C229 45.7 221.84 40 209 40c-16.85 0-38.46 11.28-57.81 30.16A140 140 0 0 0 136 87.53V56a8 8 0 0 0-16 0v31.53a140 140 0 0 0-15.15-17.37C85.49 51.28 63.88 40 47 40c-12.84 0-20 5.7-23.7 10.48c-6.82 8.77-12.18 24.08-.21 71.2c6.05 23.83 19.51 33 30.63 36.42A44 44 0 0 0 128 205.27a44 44 0 0 0 74.28-47.17c11.12-3.4 24.57-12.59 30.63-36.42c6.72-26.44 11.94-55.58-.21-71.2M92 208a28.12 28.12 0 0 1-3.14-56a8 8 0 1 0-1.76-15.9a43.64 43.64 0 0 0-20.74 7.9c-8.43.09-22-3.57-27.76-26.26c-2.88-11.35-11.6-45.88-2.66-57.44C37.37 58.46 40.09 56 47 56c27.27 0 73 44.88 73 71.67V180a28 28 0 0 1-28 28m125.4-90.26c-5.77 22.69-19.33 26.34-27.77 26.26a43.6 43.6 0 0 0-20.74-7.95a8 8 0 1 0-1.76 15.9A28.11 28.11 0 1 1 136 180v-52.33C136 100.88 181.69 56 209 56c6.95 0 9.66 2.46 11.1 4.3c8.95 11.56.18 46.09-2.7 57.44"/></svg> popo知识库</h2>
    </div>
    <div class="knowledge-search-bar">
      <input type="text" id="knowledge-search" class="search-input" placeholder="搜索句子内容、来源、文件夹或标签...">
    </div>
    <div class="knowledge-filters" id="knowledge-filters">
      <div class="filter-group">
        <span class="filter-label">文件夹</span>
        <div class="filter-chips" id="folder-chips"></div>
        <button class="btn-mini" id="btn-new-folder">+ 新建</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">标签</span>
        <div class="filter-chips" id="tag-chips"></div>
      </div>
    </div>
    <div class="knowledge-sort" id="knowledge-sort"></div>
    <div class="knowledge-list" id="knowledge-list"></div>
    <button class="fab" id="fab-add-sentence" title="添加句子">+</button>
  </section>
</main>

<!-- ============ 底部导航 ============ -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">

    <span class="nav-label">首页</span>
